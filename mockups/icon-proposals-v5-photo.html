<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>Otter 图标 · 真实照片方向</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0B0F13; color: #E9F1F5; font-family: -apple-system, "PingFang SC", sans-serif; padding: 34px; }
  h1 { font-size: 24px; } .sub { color: #8FA6B2; font-size: 13px; margin-top: 8px; line-height: 1.7; max-width: 1000px; }
  .hint { color: #6ED3E8; font-size: 12.5px; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 22px; }
  .card { background: #141B21; border: 1px solid #232F38; border-radius: 20px; padding: 18px; }
  .top { display: flex; gap: 16px; align-items: flex-start; }
  .shape { width: 170px; height: 170px; border-radius: 22.37%; overflow: hidden; flex: none; box-shadow: 0 14px 34px rgba(0,0,0,0.55); }
  .shape img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tag { font-size: 10px; letter-spacing: 0.16em; color: #6E8794; text-transform: uppercase; margin-bottom: 3px; }
  .name { font-size: 15px; font-weight: 650; } .desc { font-size: 11.5px; color: #9FB3BE; line-height: 1.65; margin-top: 7px; }
  .sizes { display: flex; align-items: flex-end; gap: 13px; margin-top: 14px; }
  .sizes .s { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .sizes .s span { font-size: 8.5px; color: #6E8794; }
  .sizes .box { border-radius: 22.37%; overflow: hidden; } .sizes img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .credit { color: #5E7480; font-size: 10px; margin-top: 10px; }
  .bar { margin-top: 14px; padding: 9px 13px; background: #0A0F13; border-radius: 11px; display: flex; align-items: center; gap: 12px; }
  .bar .b { font-size: 9.5px; color: #6E8794; margin-right: auto; }
  .bar .glyph { width: 19px; height: 19px; } .bar svg { width: 100%; height: 100%; display: block; }
  .duo img { filter: grayscale(0.35) sepia(0.25) hue-rotate(150deg) saturate(1.15) contrast(1.05); }
  .ring { position: relative; } .ring::after { content: ""; position: absolute; inset: 0; border-radius: 22.37%; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.16); }
</style></head><body>
<h1>Otter 图标 · 真实照片方向（v5）</h1>
<div class="sub">直接拿真实海獭照片做图标（和 Bing 图同一种气质），再试一个「压成青灰色调」的版本。照片来自 Wikimedia Commons，CC BY 2.0，作者 Mike Baird；如果最终用照片，需要在小字里署名。</div>
<div class="hint">回字母即可；也可以说「照片但压成青色调」/「照片 + 玻璃边」。</div>
<div class="grid" id="grid"></div>
<template id="tpl"><div class="card"><div class="top"><div class="shape">ICON</div>
<div><div class="tag"></div><div class="name"></div><div class="desc"></div><div class="credit">Photo: Mike Baird / Wikimedia Commons, CC BY 2.0</div></div></div>
<div class="sizes">SIZES</div>
<div class="bar"><span class="b">菜单栏模板</span><span class="glyph">TPL</span><span class="t">▣ 20% ▤ 70%</span></div>
</div></template>
<script>
var TPL = '<svg viewBox="0 0 32 32" fill="#000" xmlns="http://www.w3.org/2000/svg"><path d="M6 16c0-5 4.5-9 10-9 2.6 0 5 .9 6.7 2.4 2.2 0 3.8 1.7 3.8 4 0 2.2-1.5 3.8-3.6 4.1-1.4 2.9-4 4.5-7 4.5-5.5 0-9.9-3.4-9.9-6z"/></svg>';
var PHOTOS = [
  { l: "P1", name: "母子海獭（实拍）", tag: "PHOTO · MOTHER & PUP", src: "file:///tmp/otter-photo-1.jpg", desc: "母獭抱着幼崽浮在水面。真实、有温度，但 16px 会糊成一团毛球。" },
  { l: "P2", name: "海獭特写（实拍）", tag: "PHOTO · CLOSE-UP", src: "file:///tmp/otter-photo-2.jpg", desc: "头部特写，湿亮皮毛和胡须都清楚；裁成方形后像一张小照片。" },
  { l: "P3", name: "母子 · 青灰调", tag: "PHOTO · DUOTONE", src: "file:///tmp/otter-photo-3.jpg", duo: true, desc: "同一张照片压成青灰调，和默认 E 玻璃主题更统一，也不那么像图库照片。" },
  { l: "P4", name: "照片 + 玻璃边", tag: "PHOTO + GLASS", src: "file:///tmp/otter-photo-2.jpg", ring: true, desc: "照片外面加一圈玻璃高光边，接近 macOS 26 的图标语言。" }
];
var grid = document.getElementById("grid");
var tpl = document.getElementById("tpl");
PHOTOS.forEach(function (it) {
  var node = tpl.content.firstElementChild.cloneNode(true);
  node.querySelector(".tag").textContent = it.tag + " · " + it.l;
  node.querySelector(".name").textContent = it.name;
  node.querySelector(".desc").textContent = it.desc;
  function make(size) {
    var box = document.createElement("div");
    box.style.width = size + "px"; box.style.height = size + "px";
    box.style.borderRadius = "22.37%"; box.style.overflow = "hidden";
    if (it.duo) box.className = "duo";
    var img = document.createElement("img"); img.src = it.src;
    img.style.width = "100%"; img.style.height = "100%"; img.style.objectFit = "cover"; img.style.display = "block";
    box.appendChild(img);
    if (it.ring) { var r = document.createElement("div"); r.style.position="absolute"; r.style.inset="0"; r.style.borderRadius="22.37%"; r.style.boxShadow="inset 0 0 0 3px rgba(255,255,255,0.18)"; box.style.position="relative"; box.appendChild(r); }
    return box;
  }
  var big = node.querySelector(".shape"); big.innerHTML = ""; big.appendChild(make(170));
  var sizes = node.querySelector(".sizes");
  [128, 64, 32, 16].forEach(function (px) {
    var d = document.createElement("div"); d.className = "s";
    var b = make(px); b.style.borderRadius = "22.37%";
    var lab = document.createElement("span"); lab.textContent = px;
    d.appendChild(b); d.appendChild(lab); sizes.appendChild(d);
  });
  node.querySelector(".glyph").innerHTML = TPL;
  grid.appendChild(node);
});
</script>
</body></html>
