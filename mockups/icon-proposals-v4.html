<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>Otter 图标 v4 · 海獭写实插画</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0B0F13; color: #E9F1F5; font-family: -apple-system, "PingFang SC", sans-serif; padding: 34px; }
  h1 { font-size: 25px; letter-spacing: -0.3px; }
  .sub { color: #8FA6B2; font-size: 13px; margin-top: 8px; line-height: 1.7; max-width: 1040px; }
  .hint { color: #6ED3E8; font-size: 12.5px; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 24px; }
  .card { background: #141B21; border: 1px solid #232F38; border-radius: 20px; padding: 18px; }
  .top { display: flex; gap: 16px; align-items: flex-start; }
  .shape { width: 168px; height: 168px; border-radius: 22.37%; overflow: hidden; flex: none; box-shadow: 0 14px 34px rgba(0,0,0,0.5); }
  .shape svg { width: 100%; height: 100%; display: block; }
  .tag { font-size: 10px; letter-spacing: 0.16em; color: #6E8794; text-transform: uppercase; margin-bottom: 3px; }
  .name { font-size: 15px; font-weight: 650; }
  .desc { font-size: 11.5px; color: #9FB3BE; line-height: 1.65; margin-top: 7px; }
  .sizes { display: flex; align-items: flex-end; gap: 13px; margin-top: 14px; }
  .sizes .s { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .sizes .s span { font-size: 8.5px; color: #6E8794; }
  .sizes .box { border-radius: 22.37%; overflow: hidden; }
  .sizes .box svg { width: 100%; height: 100%; display: block; }
  .bar { margin-top: 14px; padding: 9px 13px; background: #0A0F13; border-radius: 11px; display: flex; align-items: center; gap: 12px; }
  .bar .b { font-size: 9.5px; color: #6E8794; margin-right: auto; }
  .bar .glyph { width: 19px; height: 19px; } .bar .glyph svg { width: 100%; height: 100%; display: block; }
  .bar .t { font-size: 10.5px; color: #C9D8E0; }
</style></head><body>
<h1>Otter 图标 · 按真实海獭画（v4）</h1>
<div class="sub">照着你搜到的照片特征来：浮在水面、小耳朵、湿亮皮毛、宽脸、大黑眼、白胡须、水波纹。不再是几何符号，也不是卡通熊。</div>
<div class="hint">回字母即可；选定后我再做 16px 检查、出 .icns 全尺寸。</div>
<div class="grid" id="grid"></div>
<template id="tpl"><div class="card"><div class="top"><div class="shape">ICON</div>
<div><div class="tag"></div><div class="name"></div><div class="desc"></div></div></div>
<div class="sizes">SIZES</div>
<div class="bar"><span class="b">菜单栏模板</span><span class="glyph">TPL</span><span class="t">▣ 20% ▤ 70%</span></div>
</div></template>
<script src="icons-v4.js"></script>
</body></html>
