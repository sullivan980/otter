<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Otter · 主题提案</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; background: #101418; color: #E8EEF2; padding: 28px; }
  .intro { max-width: 1400px; margin: 0 auto 28px; }
  .intro h1 { font-size: 26px; letter-spacing: -0.3px; }
  .intro p { color: #93A6B0; margin-top: 8px; line-height: 1.7; font-size: 13.5px; }
  .intro .hint { margin-top: 10px; color: #6ED3E8; font-size: 12.5px; }
  .theme { max-width: 1400px; margin: 0 auto 46px; border-radius: 24px; padding: 26px; position: relative; overflow: hidden; }
  .theme .head { display: flex; gap: 16px; align-items: flex-start; position: relative; z-index: 2; }
  .letter { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; }
  .head h2 { font-size: 21px; letter-spacing: -0.3px; }
  .head .tag { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.55; margin-bottom: 4px; }
  .head p { font-size: 13px; line-height: 1.7; margin-top: 6px; max-width: 780px; }
  .palette { display: flex; gap: 8px; margin: 16px 0 4px; position: relative; z-index: 2; flex-wrap: wrap; }
  .chip { height: 26px; padding: 0 12px; border-radius: 999px; font-size: 10.5px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .art { position: absolute; right: 30px; bottom: 18px; width: 380px; height: 380px; opacity: 0.12; color: currentColor; pointer-events: none; z-index: 1; }
  .stage { display: flex; gap: 18px; align-items: flex-start; margin-top: 18px; position: relative; z-index: 2; flex-wrap: wrap; }
  /* ---------- 菜单栏 ---------- */
  .menubar { width: 100%; flex: 0 0 100%; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 14px; font-size: 12px; letter-spacing: 0.2px; }
  .menubar .brand { margin-right: auto; display: flex; align-items: center; gap: 6px; font-weight: 600; }
  /* ---------- HUD ---------- */
  .hud { width: 400px; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 9px; }
  .hud-top { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 2px 4px 6px; }
  .hud-top .mark { width: 18px; height: 18px; }
  .hud-top b { font-size: 12.5px; letter-spacing: 0.2px; }
  .live { font-size: 10.5px; opacity: 0.75; display: flex; align-items: center; gap: 4px; }
  .live i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .hud-top .clock { margin-left: auto; font-size: 10.5px; opacity: 0.6; font-variant-numeric: tabular-nums; }
  .tile { border-radius: 13px; padding: 11px 12px; }
  .tile .lbl { display: flex; justify-content: space-between; font-size: 10.5px; letter-spacing: 0.2px; opacity: 0.7; }
  .big { font-size: 34px; font-weight: 650; letter-spacing: -1px; line-height: 1.1; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .big small { font-size: 15px; font-weight: 500; opacity: 0.7; margin-left: 2px; }
  .spark { height: 26px; margin-top: 6px; border-radius: 6px; overflow: hidden; }
  .row2 { display: flex; gap: 9px; }
  .row2 .tile { flex: 1; }
  .sub { font-size: 10px; opacity: 0.62; margin-top: 2px; }
  .bar { height: 5px; border-radius: 99px; margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; }
  .net { display: flex; align-items: center; gap: 18px; }
  .net .k { font-size: 10px; opacity: 0.6; margin-bottom: 3px; }
  .net .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .net .v span { font-size: 10px; font-weight: 500; opacity: 0.6; margin-left: 2px; }
  .procs .row { display: flex; gap: 8px; align-items: center; font-size: 11.5px; padding: 3px 0; }
  .procs .row b { font-weight: 500; }
  .procs .row .pct { margin-left: auto; opacity: 0.62; font-variant-numeric: tabular-nums; }
  .procs .row .mem { width: 58px; text-align: right; opacity: 0.45; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 8px; }
  .actions .btn { flex: 1; text-align: center; font-size: 11.5px; font-weight: 500; padding: 8px 0; border-radius: 9px; }
  .actions .btn.primary { font-weight: 600; }
  /* ---------- 主窗口 ---------- */
  .window { width: 860px; border-radius: 16px; overflow: hidden; display: flex; min-height: 470px; }
  .side { width: 168px; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
  .side .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 650; padding: 0 8px 14px; }
  .side .brand .mark { width: 22px; height: 22px; }
  .side .item { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 8px 10px; border-radius: 8px; }
  .side .item.on { font-weight: 600; }
  .side .foot { margin-top: auto; font-size: 10px; opacity: 0.55; line-height: 1.6; padding: 0 8px; }
  .main { flex: 1; padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; }
  .main h3 { font-size: 21px; letter-spacing: -0.4px; }
  .main .desc { font-size: 12px; opacity: 0.6; }
  .banner { border-radius: 12px; padding: 12px 14px; font-size: 12px; display: flex; gap: 10px; align-items: flex-start; }
  .banner b { display: block; font-size: 12.5px; margin-bottom: 2px; }
  .banner .ok { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; flex: none; }
  .console { border-radius: 12px; padding: 12px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; line-height: 1.75; flex: 0 1 auto; max-height: 190px; overflow: hidden; }
  .console .dim { opacity: 0.5; }
  .foot-actions { display: flex; gap: 10px; margin-top: auto; }
  .foot-actions .btn { font-size: 12px; padding: 8px 18px; border-radius: 8px; }
  /* ================= A · 河岸晨雾 ================= */
  #A { background: linear-gradient(150deg, #F3F8F7 0%, #E4F0F1 46%, #D8E9EC 100%); color: #16323E; }
  #A::before { content: ""; position: absolute; inset: -20% -10% auto auto; width: 520px; height: 520px; background: radial-gradient(circle at 30% 30%, rgba(127,200,212,0.45), transparent 62%); border-radius: 50%; filter: blur(6px); }
  #A .letter { background: #16323E; color: #EAF6F7; }
  #A .chip { background: rgba(22,50,62,0.06); }
  #A .menubar { background: rgba(22,50,62,0.06); color: #16323E; }
  #A .hud { background: rgba(255,255,255,0.66); box-shadow: 0 18px 40px rgba(22,50,62,0.14); border: 1px solid rgba(255,255,255,0.8); }
  #A .tile { background: rgba(255,255,255,0.6); border: 1px solid rgba(22,50,62,0.05); }
  #A .live i { background: #3FA77C; }
  #A .big { color: #123039; }
  #A .spark { background: linear-gradient(180deg, rgba(46,125,143,0.16), rgba(46,125,143,0)); }
  #A .spark svg { display: block; width: 100%; height: 100%; }
  #A .bar { background: rgba(22,50,62,0.10); }
  #A .bar i { background: #2E7D8F; }
  #A .actions .btn { background: rgba(22,50,62,0.06); }
  #A .actions .btn.primary { background: #2E7D8F; color: #fff; }
  #A .window { background: #FBFDFD; box-shadow: 0 22px 50px rgba(22,50,62,0.16); border: 1px solid rgba(22,50,62,0.06); }
  #A .side { background: #EFF6F6; border-right: 1px solid rgba(22,50,62,0.06); }
  #A .item.on { background: rgba(46,125,143,0.12); color: #1C5C6B; }
  #A .banner { background: #E8F5EC; color: #245A3A; }
  #A .banner .ok { background: #3FA77C; color: #fff; }
  #A .console { background: #F0F6F6; color: #3C5B64; }
  #A .foot-actions .btn { background: rgba(22,50,62,0.06); }
  #A .foot-actions .btn.p { background: #2E7D8F; color: #fff; }
  /* ================= B · 温泉汤屋 ================= */
  #B { background: linear-gradient(150deg, #FBF0E2 0%, #F6E3CE 55%, #F0D8BF 100%); color: #4A3427; }
  #B::before { content: ""; position: absolute; left: -8%; bottom: -30%; width: 460px; height: 460px; background: radial-gradient(circle, rgba(226,168,116,0.5), transparent 64%); border-radius: 50%; }
  #B .letter { background: #C06A3F; color: #FFF6EC; }
  #B .chip { background: rgba(74,52,39,0.07); }
  #B .menubar { background: rgba(74,52,39,0.07); color: #4A3427; }

  #B .live i { background: #6C9A6E; }
  #B .big { color: #4A2F22; }
  #B .spark { background: linear-gradient(180deg, rgba(210,118,74,0.16), transparent); }
  #B .bar { background: rgba(74,52,39,0.10); }
  #B .bar i { background: #D2764A; }
  #B .actions .btn { background: rgba(74,52,39,0.07); }
  #B .actions .btn.primary { background: #C06A3F; color: #FFF6EC; }
  #B .window { background: #FFFBF4; box-shadow: 0 22px 50px rgba(120,70,40,0.20); border: 1px solid rgba(120,70,40,0.08); }
  #B .side { background: #F8EBDC; border-right: 1px solid rgba(120,70,40,0.08); }
  #B .item.on { background: rgba(210,118,74,0.14); color: #9B4F2C; }
  #B .banner { background: #EDF4E6; color: #47603B; }
  #B .banner .ok { background: #6C9A6E; color: #fff; }
  #B .console { background: #F8EFE3; color: #6B5040; }
  #B .foot-actions .btn { background: rgba(74,52,39,0.07); }
  #B .foot-actions .btn.p { background: #C06A3F; color: #FFF6EC; }
  /* ================= C · 深潜 ================= */
  #C { background: radial-gradient(120% 90% at 82% 8%, #123A46 0%, #0A2029 48%, #061419 100%); color: #D9F1F4; }
  #C::before { content: ""; position: absolute; inset: auto auto -180px -120px; width: 520px; height: 520px; background: radial-gradient(circle, rgba(79,209,197,0.22), transparent 62%); border-radius: 50%; }
  #C::after { content: ""; position: absolute; right: 8%; top: 12%; width: 6px; height: 6px; border-radius: 50%; background: #6EE7DA; box-shadow: 0 0 18px 6px rgba(110,231,218,0.45), -120px 60px 0 0 rgba(110,231,218,0.28), -260px -30px 0 0 rgba(110,231,218,0.20); }
  #C .letter { background: #4FD1C5; color: #05222A; }
  #C .chip { background: rgba(217,241,244,0.08); }
  #C .menubar { background: rgba(217,241,244,0.08); color: #D9F1F4; }
  #C .hud { background: rgba(13,38,47,0.82); border: 1px solid rgba(110,231,218,0.16); box-shadow: 0 22px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06); }
  #C .tile { background: rgba(255,255,255,0.045); border: 1px solid rgba(110,231,218,0.08); }

  #C .big { color: #EAFDFF; }
  #C .spark { background: linear-gradient(180deg, rgba(79,209,197,0.22), transparent); }
  #C .bar { background: rgba(217,241,244,0.10); }
  #C .bar i { background: linear-gradient(90deg, #4FD1C5, #7FB3F5); }
  #C .actions .btn { background: rgba(217,241,244,0.08); }
  #C .actions .btn.primary { background: linear-gradient(120deg, #4FD1C5, #3FA8D8); color: #04222A; }
  #C .window { background: #0B1F27; border: 1px solid rgba(110,231,218,0.12); box-shadow: 0 26px 60px rgba(0,0,0,0.55); }
  #C .side { background: #081A21; border-right: 1px solid rgba(110,231,218,0.10); }
  #C .item.on { background: rgba(79,209,197,0.14); color: #9EF3EA; }
  #C .banner { background: rgba(79,209,197,0.12); color: #A9F0E8; }
  #C .banner .ok { background: #4FD1C5; color: #04222A; }
  #C .console { background: #081A21; color: #8FB8C2; }
  #C .foot-actions .btn { background: rgba(217,241,244,0.08); }
  #C .foot-actions .btn.p { background: #4FD1C5; color: #04222A; }
  /* ================= D · 纸水獭 ================= */
  #D { background: #F3EDE0; color: #2B2A26; }
  #D::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(43,42,38,0.055) 1px, transparent 1px); background-size: 5px 5px; opacity: 0.6; }
  #D .letter { background: #2B2A26; color: #F3EDE0; border-radius: 4px; }

  #D .bar i { background: #3F6B5A; border-radius: 2px; }
  #D .actions .btn { background: #FFFDF7; border: 1px solid #2B2A26; border-radius: 6px; }
  #D .actions .btn.primary { background: #2B2A26; color: #F3EDE0; }

  /* ---------- 小屏 ---------- */
  @media (max-width: 1420px) { .stage { flex-wrap: wrap; } .window { width: 100%; } }

<body>
<header class="intro">
  <h1>Otter 主题提案 · 海獭爱干净</h1>
  <p>五套完整视觉方向：菜单栏、HUD、主界面同一套语言。方向都围绕「海獭 + 水 + 清洁感」：河岸的晨雾、温泉的蒸汽、深潜的荧光、纸上的手绘、以及 macOS 26 的液态玻璃。</p>
  <p class="hint">挑一个字母回复我（可以组合，比如「A 的 HUD + C 的深色」），我按选中方案把整个应用重做视觉。</p>
</header><main id="holder"></main>
